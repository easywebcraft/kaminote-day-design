<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
<title>こどもたちが草原であそんでいるイラスト</title>
<!--
  かみのてKIDS・SMILE トップのイメージイラスト。
  3案（plan-a / plan-b / plan-c）で同じ画像を object-fit:cover で使うため、
  クロップされても主役が欠けないように作ってある:
  ・plan-b は 1:1 のまるい切り抜き → 中央 1000px（x=300〜1300）に収める
  ・スマホの plan-a は縦長になり、中央 530px 程度しか残らない
    → こども3人は x=580〜1030 の内側に置く。外側は木や雲など、切れてよいものだけ。
  色はサイトの pg / coral / sun / sky のトークンと同じ値を使っている
  （XMLコメントには連続ハイフンを書けないので、変数名はハイフンを外してある）。
  肌の色を3人で変えているのは、多言語対応を強みにしている事業所だから。
-->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d7edf4"/>
    <stop offset="1" stop-color="#eef9f1"/>
  </linearGradient>
</defs>

<rect width="1600" height="1000" fill="url(#sky)"/>

<!-- 太陽 -->
<circle cx="268" cy="196" r="118" fill="#f7c948" opacity=".22"/>
<circle cx="268" cy="196" r="82" fill="#f7c948" opacity=".9"/>

<!-- 雲 -->
<g fill="#ffffff" opacity=".9">
  <path d="M420 232c0-26 21-47 47-47 8 0 15 2 22 5 9-22 30-37 55-37 33 0 59 26 59 59 0 3 0 6-1 9 20 4 35 22 35 43H420Z"/>
  <path d="M1080 168c0-21 17-38 38-38 6 0 12 1 17 4 7-18 24-30 44-30 26 0 47 21 47 47 0 2 0 5-1 7 16 3 28 17 28 34h-173Z"/>
  <path d="M1320 330c0-16 13-29 29-29 5 0 9 1 13 3 5-14 19-23 34-23 20 0 36 16 36 36 0 2 0 4-1 6 12 2 21 13 21 26h-132Z"/>
</g>

<!-- 鳥 -->
<g stroke="#7fb8cd" stroke-width="5" fill="none" stroke-linecap="round">
  <path d="M905 205q17-15 34 0"/><path d="M939 205q17-15 34 0"/>
  <path d="M1000 268q13-11 26 0"/><path d="M1026 268q13-11 26 0"/>
</g>

<!-- 遠くの丘。地平線を低めに置いて、上半分を空きにしてある
     （ヒーローの見出しとボタンがこの空の上に乗るため） -->
<path d="M0 752c150-58 274-58 404-16s262 44 404-6 292-60 428-18 246 46 364 22v266H0Z" fill="#c3e6d1"/>
<!-- 手前の丘 -->
<path d="M0 830c186-64 316-52 450-14s268 42 402 4 288-52 418-14 214 42 330 30v164H0Z" fill="#a5dbba"/>
<!-- 地面 -->
<rect y="874" width="1600" height="126" fill="#8ecfa5"/>
<path d="M0 874c210 34 380 34 560 8s330-30 520-6 340 30 520 6v118H0Z" fill="#97d4ac"/>

<!-- 木（左右。スマホでは切れる位置） -->
<g>
  <rect x="168" y="600" width="26" height="240" rx="13" fill="#b98a5f"/>
  <circle cx="181" cy="566" r="96" fill="#6cb98c"/>
  <circle cx="112" cy="614" r="62" fill="#7cc59a"/>
  <circle cx="250" cy="616" r="58" fill="#5daa7d"/>
</g>
<g>
  <rect x="1414" y="642" width="22" height="200" rx="11" fill="#b98a5f"/>
  <circle cx="1425" cy="612" r="80" fill="#6cb98c"/>
  <circle cx="1366" cy="652" r="52" fill="#7cc59a"/>
  <circle cx="1484" cy="654" r="48" fill="#5daa7d"/>
</g>

<!-- 草むら -->
<g stroke="#6cb98c" stroke-width="7" fill="none" stroke-linecap="round">
  <path d="M330 862v-30M348 862v-42M366 862v-30"/>
  <path d="M1210 878v-30M1228 878v-42M1246 878v-30"/>
</g>

<!-- 花 -->
<g>
  <circle cx="452" cy="884" r="13" fill="#f5a25a"/><circle cx="452" cy="884" r="5" fill="#fff"/>
  <circle cx="1132" cy="900" r="13" fill="#a99bd4"/><circle cx="1132" cy="900" r="5" fill="#fff"/>
  <circle cx="560" cy="930" r="12" fill="#f7c948"/><circle cx="560" cy="930" r="4.5" fill="#fff"/>
</g>

<!-- ============ こども3人（x=580〜1030 の内側） ============
     全体を下に寄せてあるのは、ヒーローの中央にキャッチとボタンが乗るため。
     顔がボタンの真後ろに来ないよう、足元を画面のいちばん下に置いている。 -->
<g transform="translate(0 78)">

<!-- 左：両手をあげてよろこぶ子 -->
<g transform="translate(650 856)">
  <rect x="-30" y="-16" width="27" height="16" rx="8" fill="#3f4a43"/>
  <rect x="3" y="-16" width="27" height="16" rx="8" fill="#3f4a43"/>
  <rect x="-24" y="-78" width="19" height="68" rx="9.5" fill="#5b6b78"/>
  <rect x="5" y="-78" width="19" height="68" rx="9.5" fill="#5b6b78"/>
  <path d="M-30 -138 -66 -186" stroke="#f2c9a0" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M30 -138 66 -186" stroke="#f2c9a0" stroke-width="17" stroke-linecap="round" fill="none"/>
  <rect x="-34" y="-150" width="68" height="82" rx="26" fill="#f5a25a"/>
  <circle cx="0" cy="-188" r="36" fill="#f2c9a0"/>
  <path d="M-36 -192a36 36 0 0 1 72 0c2-28-14-44-36-44s-38 16-36 44Z" fill="#4a3b30"/>
  <circle cx="-12" cy="-188" r="4.2" fill="#3f4a43"/>
  <circle cx="12" cy="-188" r="4.2" fill="#3f4a43"/>
  <circle cx="-23" cy="-177" r="6" fill="#f4a09a" opacity=".55"/>
  <circle cx="23" cy="-177" r="6" fill="#f4a09a" opacity=".55"/>
  <path d="M-10 -176q10 9 20 0" stroke="#3f4a43" stroke-width="3.6" fill="none" stroke-linecap="round"/>
</g>

<!-- 中央：ボールをかかえた子 -->
<g transform="translate(812 862)">
  <rect x="-31" y="-16" width="28" height="16" rx="8" fill="#3f4a43"/>
  <rect x="3" y="-16" width="28" height="16" rx="8" fill="#3f4a43"/>
  <rect x="-25" y="-82" width="20" height="72" rx="10" fill="#4d5f6b"/>
  <rect x="5" y="-82" width="20" height="72" rx="10" fill="#4d5f6b"/>
  <rect x="-36" y="-158" width="72" height="86" rx="27" fill="#4e9c72"/>
  <!-- ボールは胴の下端にかかる位置に。中心に置くと「おなか」に見える -->
  <circle cx="0" cy="-84" r="31" fill="#f7c948"/>
  <path d="M-31 0a31 31 0 0 1 62 0" transform="translate(0 -84)" fill="none" stroke="#e0ad1f" stroke-width="3.5"/>
  <path d="M-33 -146 -29 -84" stroke="#d9a273" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M33 -146 29 -84" stroke="#d9a273" stroke-width="17" stroke-linecap="round" fill="none"/>
  <circle cx="0" cy="-196" r="38" fill="#d9a273"/>
  <path d="M-38 -200a38 38 0 0 1 76 0c3-30-15-47-38-47s-41 17-38 47Z" fill="#2f2721"/>
  <circle cx="-13" cy="-196" r="4.4" fill="#3f4a43"/>
  <circle cx="13" cy="-196" r="4.4" fill="#3f4a43"/>
  <circle cx="-25" cy="-184" r="6.4" fill="#f4a09a" opacity=".5"/>
  <circle cx="25" cy="-184" r="6.4" fill="#f4a09a" opacity=".5"/>
  <path d="M-11 -183q11 10 22 0" stroke="#3f4a43" stroke-width="3.8" fill="none" stroke-linecap="round"/>
</g>

<!-- 右：すわって積み木であそぶ子 -->
<g transform="translate(958 878)">
  <rect x="-14" y="-30" width="88" height="24" rx="12" fill="#6b7f8e"/>
  <rect x="52" y="-34" width="26" height="18" rx="9" fill="#3f4a43"/>
  <ellipse cx="-16" cy="-34" rx="34" ry="25" fill="#6b7f8e"/>
  <rect x="-48" y="-116" width="66" height="86" rx="25" fill="#7fb8cd"/>
  <path d="M14 -86 62 -56" stroke="#b57a4e" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M-44 -88 -58 -50" stroke="#b57a4e" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="-15" cy="-152" r="35" fill="#b57a4e"/>
  <path d="M-50 -156a35 35 0 0 1 70 0c3-27-14-43-35-43s-38 16-35 43Z" fill="#241d18"/>
  <circle cx="-27" cy="-152" r="4.2" fill="#3f4a43"/>
  <circle cx="-3" cy="-152" r="4.2" fill="#3f4a43"/>
  <circle cx="-38" cy="-141" r="6" fill="#f4a09a" opacity=".45"/>
  <circle cx="8" cy="-141" r="6" fill="#f4a09a" opacity=".45"/>
  <path d="M-25 -140q10 9 20 0" stroke="#3f4a43" stroke-width="3.6" fill="none" stroke-linecap="round"/>
</g>

<!-- 積み木 -->
<g>
  <rect x="1042" y="-40" width="44" height="40" rx="9" fill="#f5a25a" transform="translate(0 878)"/>
  <rect x="1092" y="-36" width="36" height="36" rx="8" fill="#a99bd4" transform="translate(0 878)"/>
  <rect x="1050" y="-78" width="36" height="36" rx="8" fill="#f7c948" transform="translate(0 878)"/>
  <rect x="700" y="-34" width="34" height="34" rx="8" fill="#7fb8cd" transform="translate(0 862)"/>
  <rect x="740" y="-30" width="30" height="30" rx="7" fill="#f7c948" transform="translate(0 862)"/>
</g>
</g>
</svg>
